[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-pdf-rebuilder"
version = "0.1.0"
description = "Resumable, failure-isolated OCR and PDF reconstruction pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mineru==3.3.1",
  "Pillow==12.2.0",
  "PyMuPDF==1.27.2.3",
  "reportlab==4.5.1",
  "svglib==2.0.2",
]

[project.scripts]
ocr-pdf-rebuilder = "ocr_pdf_rebuilder.mineru_pipeline:main"
ocr-pdf-rebuilder-paddle = "ocr_pdf_rebuilder.paddle_textonly_pdf:main"
ocr-pdf-rebuilder-gui = "ocr_pdf_rebuilder.gui:main"

[project.urls]
Homepage = "https://github.com/TIAIMM/ocr-pdf-rebuilder"
Repository = "https://github.com/TIAIMM/ocr-pdf-rebuilder"
Issues = "https://github.com/TIAIMM/ocr-pdf-rebuilder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
